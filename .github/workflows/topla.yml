name: Turnuvaları topla

on:
  schedule:
    - cron: "0 4 * * *"   # her gün 07:00 (Türkiye saati)
  workflow_dispatch:
  push:
    branches: [bildirim]
    paths: [scripts/**, .github/workflows/topla.yml]

permissions:
  contents: write

jobs:
  topla:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 pymupdf
      - run: python scripts/topla.py
      - name: Bildirim gönder
        run: python scripts/bildir.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "turnuva-botu"
          git config user.email "actions@users.noreply.github.com"
          git add web/tournaments.json data/bildirilen.json
          git diff --cached --quiet || (git commit -m "Turnuva listesi güncellendi" && git push)
