name: Android uygulaması

on:
  push:
    branches: [main, mobil]
    paths: [mobile/**, web/index.html, web/app.js, web/style.css, web/manifest.json, .github/workflows/android.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run web
      - run: npx cap add android
      - name: Arka plan çalıştırıcısı ve sürüm numarası
        run: |
          sed -i "s#dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'#&\n        dirs '../../node_modules/@capacitor/background-runner/android/src/main/libs', 'libs'#" android/app/build.gradle
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"0.1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "background-runner\|versionCode\|versionName" android/app/build.gradle
      - run: npx cap sync android
      - name: APK oluştur
        working-directory: mobile/android
        # Sabit imza anahtarı: yeni sürümler eskisinin üzerine kurulabilsin
        run: |
          mkdir -p ~/.android && cp ../debug.keystore ~/.android/debug.keystore
          ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk satranc-turnuvalari.apk
      - uses: actions/upload-artifact@v4
        with:
          name: satranc-turnuvalari-apk
          path: mobile/satranc-turnuvalari.apk
      - name: İndirme sayfasına yükle
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android >/dev/null 2>&1 || gh release create android --title "Android uygulaması" --notes "Telefonundan bu sayfayı açıp satranc-turnuvalari.apk dosyasını indir ve kur." --prerelease
          gh release upload android satranc-turnuvalari.apk --clobber
